:root{
  /* Цвет */
  --c-bg:#000000;
  --c-yellow:#FEFE00;
  --c-text:#FFFFFF;
  --c-text-2:#8E8D90;
  --c-text-3:#605F62;
  --c-pill:#131313;
  --c-pill-progress:#242424;
  --c-sheet:#19181B;
  --c-sheet-control:#28272A;
  --c-handle:#5E5B5F;
  --c-chip-dark:rgba(0,0,0,.3);
  --c-glass:rgba(255,255,255,.08);
  --c-glass-rim:rgba(255,255,255,.12);
  --c-glass-hi:rgba(255,255,255,.42);
  --c-overlay:rgba(0,0,0,.6);
  /* Шрифт: Yandex Music Sans / YS Text закрыты — ближайшие открытые замены.
     Заголовки — Geologica (OFL) с курсивными формами: однокомнатная «а», прямой хвост «у»;
     кегль и трекинг подогнаны по кадрам приложения (ширина и высота строки «Моя волна»). */
  --f-display:'Geologica','Inter',system-ui,sans-serif;
  --f-text:'Inter',system-ui,sans-serif;
  --f-display-feat:normal;
  --ls-display:-.027em;
  /* Размеры, pt */
  --r-pill:999px;
  --r-sheet:20px;
  --play:96px;
  --row-h:56px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0E0E10;overflow:hidden}
body{font-family:var(--f-text);color:var(--c-text);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- мокап ---------- */
.stage{position:relative;width:393px;height:852px;transform-origin:center;flex:none}
.phone{position:absolute;inset:-12px;border-radius:67px;background:#1B1B1D;box-shadow:0 0 0 2px #2A2A2D,0 30px 80px rgba(0,0,0,.6)}
.screen{position:absolute;left:0;top:0;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--c-bg);isolation:isolate}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62.5px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 41px;font:600 17px/1 var(--f-text);letter-spacing:-.2px;pointer-events:none}
.status .r{display:flex;gap:7px;align-items:center}

/* ---------- фон ---------- */
#bg{position:absolute;left:0;top:0;width:393px;height:852px;z-index:0;pointer-events:none}
.bgfb{position:absolute;inset:0;z-index:0;pointer-events:none;display:none}
.nogl .bgfb{display:block}

/* ---------- шапка ---------- */
.hdr{position:absolute;left:0;right:0;top:54px;height:44px;z-index:20}
.hdr .ic{position:absolute;top:50%;transform:translate(-50%,-50%)}
.hdr .plus{left:27.6px;width:29.5px}
.hdr .search{left:364.5px;width:27.7px}
.hdr .logo{left:196.5px;width:189px;height:26.75px;background:var(--c-yellow);-webkit-mask:var(--ymlogo) center/100% 100% no-repeat;mask:var(--ymlogo) center/100% 100% no-repeat}
.hdr .ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 20px/1 var(--f-display);letter-spacing:-.02em;font-feature-settings:var(--f-display-feat);color:var(--c-yellow);white-space:nowrap;opacity:0}
.chip{position:absolute;left:50%;top:50%;height:48px;margin-top:-24px;padding:0 13px 0 19.7px;border-radius:var(--r-pill);background:var(--c-chip-dark);display:flex;align-items:center;gap:9.8px;font:900 21px/1 var(--f-display);letter-spacing:-.02em;font-feature-settings:var(--f-display-feat);color:var(--c-yellow);white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.92);max-width:296px}
.chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-yellow);display:grid;place-items:center}

/* ---------- центр ---------- */
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero button{pointer-events:auto}
.big{position:absolute;left:0;right:0;top:214px;text-align:center;font:900 64px/0.92 var(--f-display);letter-spacing:var(--ls-display);font-feature-settings:var(--f-display-feat);white-space:nowrap}
.artist{position:absolute;left:14px;right:14px;top:var(--art-top,126px);height:164px;display:flex;align-items:center;justify-content:center;text-align:center;font:900 86px/.98 var(--f-display);letter-spacing:-.02em;font-feature-settings:var(--f-display-feat);opacity:0;text-wrap:balance}
.cover{position:absolute;left:149px;top:311px;width:96px;height:96px;border-radius:6px;overflow:hidden;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cover svg{display:block}
.play{position:absolute;left:148.5px;top:308.4px;width:var(--play);height:var(--play);border-radius:50%;background:var(--c-yellow);display:grid;place-items:center}
.play:active{transform:scale(.96)}
.row{position:absolute;left:32px;top:417px;width:329px;height:var(--row-h)}
.pill{position:absolute;top:0;bottom:0;left:0;right:0;border-radius:var(--r-pill);overflow:hidden}
.pill .pbase{position:absolute;inset:0;background:var(--c-pill)}
.pill .prog{position:absolute;left:0;top:0;bottom:0;width:3%;background:var(--c-pill-progress);transition:width .4s cubic-bezier(.3,0,.2,1)}
.glassy{background:var(--c-glass);-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);box-shadow:inset 0 .75px 0 var(--c-glass-hi),inset 0 0 0 1px var(--c-glass-rim)}
.pill .glass{position:absolute;inset:0;border-radius:inherit;opacity:0}
.pill .t{position:absolute;left:52px;right:52px;top:50%;transform:translateY(-50%);text-align:center;font:800 16px/20px var(--f-display);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .t2{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);text-align:center;font:800 16px/20px var(--f-display);letter-spacing:-.03em;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .skel{position:absolute;left:50%;top:50%;width:84px;height:12px;margin:-6px 0 0 -42px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.22),rgba(255,255,255,.10));background-size:200% 100%;opacity:0}
.pill .info{display:none}
.pill .heart{position:absolute;left:300.7px;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;display:grid;place-items:center}
.rb{position:absolute;top:0;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.8);pointer-events:none}
.rb.l{left:0}.rb.r{right:0}
.rb svg{opacity:0}
.ai{position:absolute;left:0;right:0;top:500px;height:60px}
.ai .spr{position:absolute;left:13.3px;top:10.6px;width:51.8px}
.ai .txt{position:absolute;left:66px;right:58px;top:1px;text-align:center;font:400 14.6px/17.7px var(--f-text);letter-spacing:-.25px;color:#F2F2F2}

/* ---------- вспышка при лайке: лучи света из-за заголовка, как в приложении ---------- */
/* ---------- барабан ---------- */
.drum{position:absolute;left:0;right:0;top:548px;height:210px;z-index:12;touch-action:pan-y;cursor:grab}
.burst{position:absolute;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,242,0,.9),rgba(255,210,0,.55) 45%,rgba(255,170,0,0));pointer-events:none;opacity:0;z-index:13;will-change:transform,opacity}
.drum.drag{cursor:grabbing}
.item{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;pointer-events:none}
.item .lay{position:absolute;left:0;top:0;width:0;height:0}
.item .bd{position:absolute;left:-95px;top:-93.1px;overflow:visible}
.item .ic{position:absolute;overflow:visible}
.item .gh{opacity:0}
.item .lbl{position:absolute;left:-64px;width:128px;top:-32.4px;text-align:center;font:500 14.2px/16.6px var(--f-text);letter-spacing:-.1px;color:#fff;text-wrap:balance;-webkit-hyphens:manual;hyphens:manual}
.item .lbl.two{top:-37.2px}
.item .cap{display:block;font:400 11.5px/14px var(--f-text);color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ttl2{display:block;margin-top:4.2px;font:600 15px/18px var(--f-text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.bare .lbl{color:var(--c-yellow)}
.item .bimg{position:absolute}
.item .rc{position:absolute;left:-95px;top:-120px;width:190px;height:330px}

/* ---------- таббар ---------- */
.tabs{position:absolute;left:0;right:0;top:760px;height:92px;z-index:14;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 26px)}
.tabs img,.tabs i{position:absolute;top:30.5px;transform:translate(-50%,-50%)}
.tabs .tab-y{background:var(--c-yellow);-webkit-mask:var(--ymflash) center/100% 100% no-repeat;mask:var(--ymflash) center/100% 100% no-repeat}


/* ---------- полноэкранный плеер ---------- */
.player{position:absolute;inset:0;z-index:45;background:var(--pl-bg,#3B2637);transform:translateY(105%);will-change:transform;overflow:hidden;touch-action:none}
.pl-glow{position:absolute;left:-40px;right:-40px;top:60px;height:520px;background:radial-gradient(50% 45% at 50% 50%,var(--pl-glow,rgba(255,255,255,.08)),rgba(0,0,0,0));pointer-events:none}
/* прокрутка: контент едет под шапкой, обрезается по её нижнему краю */
.pl-view{position:absolute;inset:0;clip-path:inset(92px 0 0 0)}
.pl-sc{position:absolute;left:0;top:0;width:393px;height:1790px;will-change:transform}
.pl-hdr{position:absolute;left:0;right:0;top:48px;height:44px;z-index:3}
.pl-hdr button{position:absolute;top:0;width:44px;height:44px;display:grid;place-items:center}
.pl-down{left:7px}.pl-dev{left:303px}.pl-q{left:343px}
.pl-ttl{position:absolute;left:84px;right:84px;top:0;height:44px;text-align:center;color:rgba(255,255,255,.88)}
.pl-ttl span{position:absolute;left:0;right:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s cubic-bezier(.3,0,.2,1),transform .3s cubic-bezier(.2,0,0,1)}
.pl-ttl .one{top:0;font:500 15px/44px var(--f-text);letter-spacing:-.2px}
.pl-ttl .k{top:5px;font:400 13px/16px var(--f-text);letter-spacing:-.1px;color:rgba(255,255,255,.55);opacity:0;transform:translateY(4px)}
.pl-ttl .q{top:21px;font:500 16px/20px var(--f-text);letter-spacing:-.25px;color:#fff;opacity:0;transform:translateY(4px)}
.pl-ttl.two .one{opacity:0;transform:translateY(-4px)}
.pl-ttl.two .k,.pl-ttl.two .q{opacity:1;transform:none}
.pl-track{position:absolute;left:0;right:0;top:115px;height:345px}
.pl-cv{position:absolute;left:24px;top:0;width:345px;height:345px;will-change:transform}
.pl-cv .in{position:relative;width:345px;height:345px;border-radius:8px;overflow:hidden;box-shadow:0 22px 48px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.2);transform-origin:50% 50%;will-change:transform}
.pl-cv .ld{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.06);opacity:0;pointer-events:none}

.pl-card svg.wv{position:absolute;inset:0}
.pl-card .k{position:relative;margin-top:10px;font:500 14px/17px var(--f-text);letter-spacing:-.15px;color:var(--pl-acc,#F59AE8)}
.pl-card .n{position:relative;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 24px;font:700 18px/22px var(--f-text);letter-spacing:-.3px;white-space:nowrap}

.pl-h{position:absolute;left:24px;top:1346px;font:900 22px/28px var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.pl-sim{position:absolute;left:0;right:0;top:1390px}

.pl-it .tx{flex:1;min-width:0}
.pl-it .t1{font:500 17px/21px var(--f-text);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-it .t2{margin-top:2px;font:400 15px/19px var(--f-text);letter-spacing:-.2px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-it .mo{flex:none;width:28px;display:grid;place-items:center}
.pl-it.now .t1{color:var(--pl-acc,#fff)}

.pl-mini.on{opacity:1;transform:none;pointer-events:auto}

.pl-mini .t1{position:absolute;left:62px;right:100px;top:9px;font:500 16px/20px var(--f-text);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-mini .t2{position:absolute;left:62px;right:100px;top:29px;font:400 14.5px/18px var(--f-text);letter-spacing:-.2px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pl-mini .lk{right:48px}.pl-mini .pp{right:6px}

/* ---------- шторка ---------- */
.overlay{position:absolute;inset:0;z-index:70;background:#000;opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;height:796px;background:var(--c-sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(110%);will-change:transform;overflow:hidden;--acc:#395B8C;--acc2:#6F8BC8}
.sheet .sglow{position:absolute;left:-60px;right:-60px;top:-120px;height:420px;background:radial-gradient(46% 50% at 50% 50%,var(--acc),rgba(0,0,0,0));opacity:.38;pointer-events:none;transition:background .5s cubic-bezier(.3,0,.2,1)}
.sbody{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 0 128px}
.sbody::-webkit-scrollbar{display:none}
.shead{position:relative;height:262px;touch-action:none}

.s-ttl{position:absolute;left:0;right:0;top:24px;text-align:center;font:500 15px/20px var(--f-text);color:rgba(255,255,255,.62)}

.prev .ic{position:absolute;left:-1px;top:-75.7px;will-change:transform}
.nmw{position:absolute;left:24px;right:24px;top:168px;text-align:center}
.nm{display:block;width:100%;height:40px;padding:0;border:0;background:none;text-align:center;color:#fff;font:900 27px/40px var(--f-display);letter-spacing:-.02em;font-feature-settings:var(--f-display-feat);caret-color:var(--c-yellow);outline:none;-webkit-user-select:text;user-select:text}
.nm::placeholder{color:rgba(255,255,255,.5)}
.nmcap{margin:4px auto 0;max-width:330px;max-height:36px;font:400 14px/18px var(--f-text);color:rgba(255,255,255,.55);text-wrap:balance;overflow:hidden;min-height:18px}

.grp h4 span{font:400 14px/18px var(--f-text);color:var(--c-text-3)}
.moods{display:flex;gap:0;overflow-x:auto;touch-action:pan-x;margin:-6px -16px 0;padding:10px 10px 8px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.md{flex:none;min-width:66px;padding:0 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 13px/16px var(--f-text);color:rgba(255,255,255,.66);letter-spacing:-.15px;white-space:nowrap;transition:color .2s cubic-bezier(.3,0,.2,1)}
.md .dot{position:relative;width:54px;height:54px;border-radius:50%;transition:transform .32s cubic-bezier(.2,1.4,.4,1),box-shadow .25s cubic-bezier(.3,0,.2,1)}
.md .dot .mi{position:absolute;left:27px;top:27px}
.md.on{color:#fff}
.md.on .dot{transform:scale(1.06);box-shadow:0 0 0 2.5px var(--c-sheet),0 0 0 4.5px #fff}
.md .dot .mi{transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.md.on .dot .mi{transform:scale(1.12) rotate(-8deg)}
.md:active .dot{transform:scale(.92)}
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;touch-action:pan-x;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chips::-webkit-scrollbar{display:none}
.c{flex:none;height:40px;padding:0 16px;border-radius:var(--r-pill);background:var(--c-sheet-control);font:500 15px/40px var(--f-text);letter-spacing:-.15px;color:#fff;display:flex;align-items:center;gap:7px;transition:background-color .22s cubic-bezier(.3,0,.2,1),color .22s cubic-bezier(.3,0,.2,1),transform .22s cubic-bezier(.3,0,.2,1)}
.c svg{flex:none;opacity:.8}
.c:active{transform:scale(.95);transition-duration:.08s}
.c.on{background:var(--acc);color:#fff}
.c.on svg{opacity:1}
.seg{position:relative;display:flex;height:42px;padding:3px;border-radius:var(--r-pill);background:var(--c-sheet-control)}
.seg .th{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:var(--r-pill);background:#4A494D;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transition:transform .34s cubic-bezier(.2,.9,.25,1),width .34s cubic-bezier(.2,.9,.25,1),opacity .2s}
.seg button{position:relative;flex:1;font:500 14.5px/36px var(--f-text);letter-spacing:-.15px;color:rgba(255,255,255,.62);transition:color .2s}
.seg button.on{color:#fff}
.sfoot{position:absolute;left:0;right:0;bottom:0;padding:24px 16px 30px;background:linear-gradient(rgba(25,24,27,0),var(--c-sheet) 26px)}
.save{display:block;width:100%;height:56px;border-radius:var(--r-pill);background:var(--c-yellow);color:#000;font:700 17px/56px var(--f-text);letter-spacing:-.3px;transition:background-color .2s cubic-bezier(.3,0,.2,1),color .2s cubic-bezier(.3,0,.2,1),transform .22s cubic-bezier(.3,0,.2,1)}
.save:disabled{background:var(--c-sheet-control);color:var(--c-text-3);cursor:default}
.save:not(:disabled):active{transform:scale(.97);transition-duration:.08s}
.del{position:absolute;left:12px;top:16px;height:36px;padding:0 12px;border-radius:18px;font:500 14px/36px var(--f-text);color:#FF6A5C;background:rgba(255,106,92,.1)}
.del:active{opacity:.6}

/* ---------- вне мокапа ---------- */
.reset{position:fixed;right:16px;bottom:16px;font:500 13px/1 var(--f-text);color:#6b6b70;padding:8px 12px;border-radius:999px;background:#1A1A1D}
.reset:hover{color:#aaa}
body.shot{display:block;background:#000}.shot .phone,.shot .island,.shot .reset{display:none}.shot .stage{transform:none!important}.shot .screen{border-radius:0}
</style>

const POOL=Object.keys(PRESETS).filter(k=>PRESETS[k].track);
const DRUM_N=14;
/* стартовый набор, как в приложении */
let drumSel=['unknown','motiv','calm','folk','date','lonely','energy','beauty','dreamindie','nowords','english','indie','altpop','autumn'];
/* новый набор: волны, которых сейчас нет в барабане; соседние пузыри — разного цвета */
function shuffleSel(){
  const fresh=POOL.filter(k=>!drumSel.includes(k)),rest=POOL.filter(k=>drumSel.includes(k));
  const pick=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const chosen=[...pick(fresh),...pick(rest)].slice(0,DRUM_N);
  const out=[];let left=chosen.slice();
  while(left.length){const last=out[out.length-1];let i=left.findIndex(k=>!last||PRESETS[k].col!==PRESETS[last].col);if(i<0)i=0;out.push(left.splice(i,1)[0])}

  pr.addEventListener('pointerdown',e=>{drag=true;pr.classList.add('drag');pr.setPointerCapture(e.pointerId);show(ratio(e))});
  pr.addEventListener('pointermove',e=>{if(drag)show(ratio(e))});
  pr.addEventListener('pointerup',e=>{if(!drag)return;drag=false;pr.classList.remove('drag');const s=MUS.song;if(s&&s.seek)s.seek(ratio(e)*s.dur())});
  window.plProgDragging=()=>drag;
})();
function tick(){if(!plOpen&&plY>=1.04)return;const s=MUS.song;let p=0,du=50;if(s&&s.pos&&s.kind){p=s.pos();du=s.dur()}
  if(!window.plProgDragging()){const k=du?p/du:0;$('#plFill').style.width=(k*100)+'%';$('#plKnob').style.left=(k*100)+'%'}
  $('#plCur').textContent=fmt(p);$('#plDur').textContent=fmt(du);requestAnimationFrame(tick)}

/* ---------- «Моя волна по треку»: запуск из плеера ---------- */
function startTrackWave(){
  if(busy)return;const seed=cur,key='track:'+seed.id;
  if(mode===key){togglePlay();return}
  busy=true;clearTimeline();musInit();
  const T=withAI(similar(seed,1)[0],key);prefetch(T);
  mode=key;cur=T;playing=true;screen.dataset.state='playing';queue=buildQueue(key,T);qi=0;
  /* плеер: карточка — «пауза», шапка — «Моя волна по треку / «трек»», обложка — загрузка со вспышкой */
  setCard(seed,true);plHeader();syTo(0);
  music.fade();
  const c=slots[1]&&slots[1].querySelector('.in');
  if(c){c.querySelector('img,svg').animate([{filter:'blur(0)'},{filter:'blur(22px)'}],{duration:420,easing:EASE.out,fill:'forwards'});
    tw(c.querySelector('.ld'),{opacity:1},{dur:320,delay:120});c.querySelector('.ld i').animate([{transform:'scale(.7) rotate(-20deg)'},{transform:'scale(1) rotate(0)'}],{duration:520,easing:EASE.emph})}
  /* главная под плеером: чип с названием трека вместо логотипа, пузыря для этой волны нет — только «Назад к привычному» */
  at(260,()=>{header('chip',seed.title);showPlaying(T,{delay:0,slide:false});setAI(T,0);const k=makeSet();refill(k,Math.max(0,k.indexOf('back')))});
  at(950,()=>{music.play(T);bgTo(fieldPal(T),600,'inOut');buildSlots();fillPlayer(T);
    const n=slots[1].querySelector('.in');n&&n.animate([{filter:'blur(14px)',opacity:.6,transform:'scale(.96)'},{filter:'blur(0)',opacity:1,transform:'scale(1)'}],{duration:420,easing:EASE.out})});
  at(1300,()=>{busy=false});
}

/* ================= шторка: создание и настройки своей волны ================= */
let sel={},editKey=null,sheetY=1,stopSheet=null,nameTouched=false;
const sheet=$('#sheet'),overlay=$('#overlay'),nameIn=$('#wname'),sbody=$('#sbody');
function sheetH(){return sheet.offsetHeight||796}
function setSheet(y){sheetY=y;sheet.style.transform=`translateY(${(y*sheetH()).toFixed(1)}px)`;overlay.style.opacity=(.62*(1-clamp(y,0,1))).toFixed(3)}
setSheet(1.1);
/* капли настроения — в цветах будущего пузыря */
/* настроение — маленькая вспышка в цветах будущего пузыря: мягкие пятна с рваным краем, без глянца */
function moodDot(m){const col=MOOD_COL[m],C=NAT[col],id='md'+(UID++),dk=rgb(hex(C.c1).map(v=>v*.3));
  return `<svg viewBox="0 0 54 54" width="54" height="54" style="position:absolute;left:0;top:0"><defs>
<radialGradient id="${id}g" cx=".72" cy=".2" r="1"><stop offset="0" stop-color="${C.c1}"/><stop offset=".55" stop-color="${rgb(hex(C.c1).map(v=>v*.62))}"/><stop offset="1" stop-color="${dk}"/></radialGradient>
<linearGradient id="${id}r" x1="1" y1="0" x2=".2" y2=".8"><stop offset="0" stop-color="${C.rim}" stop-opacity=".9"/><stop offset=".6" stop-color="${C.rim}" stop-opacity="0"/></linearGradient></defs>
<circle cx="27" cy="27" r="27" fill="url(#${id}g)"/><circle cx="27" cy="27" r="26.1" fill="none" stroke="url(#${id}r)" stroke-width="1.6"/></svg><i class="mi"><svg viewBox="0 0 24 24" width="25" height="25" style="position:absolute;left:-12.5px;top:-12.5px" fill="${C.icr}">${MOOD_GL[m]}</svg></i>`}
const MOOD_GL={energy:'<path d="M13.6 2 4.8 13.6h6.1L9.9 22l9.3-12.2h-6.3L13.6 2Z"/>',fun:'<path fill-rule="evenodd" d="M12 2.6a9.4 9.4 0 1 1 0 18.8 9.4 9.4 0 0 1 0-18.8ZM8.9 8.3a1.45 1.45 0 1 0 0 2.9 1.45 1.45 0 0 0 0-2.9Zm6.2 0a1.45 1.45 0 1 0 0 2.9 1.45 1.45 0 0 0 0-2.9ZM7.4 13.4a4.6 4.6 0 0 0 9.2 0Z"/>',calm:'<path fill-rule="evenodd" d="M20.6 3.2C12 3.2 4 7.3 4 15c0 1.9.6 3.6 1.6 5 1.3-4.7 4.5-8.6 8.8-11-3.8 2.9-6.6 6.7-7.8 11.6 1.3.6 2.9.9 4.6.9 8.4 0 9.4-8.9 9.4-18.3Z"/>',dream:'<path d="M7.2 19.2h10.3a4.6 4.6 0 0 0 .7-9.15 6.2 6.2 0 0 0-11.9-.4A4.8 4.8 0 0 0 7.2 19.2Z"/>',sad:'<path d="M12 2.6c-3.2 4.6-6.3 8-6.3 11.9a6.3 6.3 0 0 0 12.6 0c0-3.9-3.1-7.3-6.3-11.9Z"/>',romantic:'<path d="M12 20.6 4.3 13A5.1 5.1 0 0 1 12 6.4a5.1 5.1 0 0 1 7.7 6.6Z"/>'};

document.querySelectorAll('.md').forEach(b=>{const col=MOOD_COL[b.dataset.v];b.querySelector('.dot').innerHTML=moodDot(b.dataset.v);b.style.setProperty('--dc',NAT[col].c1+'88')});
function openSheet(key){
  if(busy)return;
  editKey=key&&isOwn(key)?key:null;const w=editKey&&waveOf(editKey);
  sel=w?{act:w.act,mood:w.mood,words:w.words,char:w.char,genres:[...(w.genres||[])]}:{genres:[]};Object.keys(sel).forEach(k=>sel[k]||delete sel[k]);if(!sel.genres)sel.genres=[];sbody.scrollTop=0;
  nameTouched=!!(w&&w.name);nameIn.value=nameTouched?w.name:'';
  $('#sTtl').textContent=w?'Настройки волны':'Новая волна';$('#del').style.display=w?'':'none';
  pvKey=null;paintSheet(true);
  overlay.style.pointerEvents='auto';stopSheet&&stopSheet();
  stopSheet=spring(()=>sheetY,setSheet,0,{w:17,z:.92});
}
function closeSheet(v=0,cb){
  nameIn.blur();overlay.style.pointerEvents='none';stopSheet&&stopSheet();
  stopSheet=spring(()=>sheetY,setSheet,1.1,{w:19,z:1,v,done:cb});
}
overlay.addEventListener('click',()=>closeSheet());
$('#sClose').addEventListener('click',()=>closeSheet());
/* живое превью: тот же пузырь, что окажется в барабане — цвет по настроению, вспышка по всем настройкам */
let pvKey=null,pvRot=0,stopPv=null;
function paintSheet(first){
  document.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('[data-v]').forEach(c=>c.classList.toggle('on',g.dataset.multi?sel.genres.includes(c.dataset.v):sel[g.dataset.g]===c.dataset.v)));
  document.querySelectorAll('.seg').forEach(g=>{const th=g.querySelector('.th'),on=g.querySelector('button.on');if(on){th.style.width=on.offsetWidth+'px';th.style.transform=`translateX(${on.offsetLeft}px)`;th.style.opacity=1}else th.style.opacity=0});
  const any=['act','mood','words','char'].some(k=>sel[k])||sel.genres.length>0;$('#save').disabled=!any;
  if(!nameTouched)nameIn.value=any?autoName(sel):'';
  const nl=nameIn.value.toLowerCase(),p=parts(sel).filter(x=>!nl.includes(x.slice(0,Math.max(4,x.length-3))));$('#nmcap').textContent=p.join(', ');
  const col=any?MOOD_COL[moodOf(sel)]:'slate',C=NAT[col];
  sheet.style.setProperty('--acc',C.c1);
  $('#sglow').style.background=`radial-gradient(46% 50% at 50% 50%,${C.c1},rgba(0,0,0,0))`;
  const key=JSON.stringify([col,any?ownIcon(sel):'plus']);
  if(key!==pvKey){
    pvKey=key;const prev=$('#prev'),old=[...prev.children];
    const v=document.createElement('div');v.className='pv';
    v.innerHTML=bodySVG(C)+`<div class="ic">${iconSVG(any?ownIcon(sel):'plus',C.ic,C.icr)}</div>`;
    prev.appendChild(v);
    if(!first){v.style.opacity=0;tw(v,{opacity:1},{dur:300});old.forEach(o=>{tw(o,{opacity:0},{dur:300});setTimeout(()=>o.remove(),320)});
      const ic=v.querySelector('.ic');ic.animate([{transform:'scale(.82) rotate(-14deg)'},{transform:'scale(1.08) rotate(4deg)',offset:.6},{transform:'scale(1) rotate(0)'}],{duration:560,easing:EASE.std})}
    else old.forEach(o=>o.remove());
  }
  $('#save').textContent=editKey?'Сохранить':'Добавить в барабан';
}
document.querySelectorAll('[data-g]').forEach(g=>g.addEventListener('click',e=>{const c=e.target.closest('[data-v]');if(!c)return;const k=g.dataset.g,v=c.dataset.v;
  if(g.dataset.multi){const a=sel.genres,i=a.indexOf(v);if(i>=0)a.splice(i,1);else{a.push(v);if(a.length>+g.dataset.multi)a.shift()}}
  else{sel[k]=sel[k]===v?undefined:v;if(!sel[k])delete sel[k]}
  paintSheet()}));
nameIn.addEventListener('input',()=>{nameTouched=nameIn.value.trim()!=='';paintSheet()});
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')nameIn.blur()});
/* пузырь перекрашивается на месте */
function refreshItem(key){
  const i=set.indexOf(key),el=items[i];if(!el)return;
  const fresh=document.createElement('div');COLQ=[];fresh.innerHTML=colHTML(key)+lblHTML(key);bindQ(fresh);fresh.querySelectorAll('[data-rk]').forEach(l=>l.__keep=1);hydrate(fresh);
  const newCol=fresh.querySelector('.col'),newLbl=fresh.querySelector('.lbl'),oldCol=el.querySelector('.col'),oldLbl=el.querySelector('.lbl');
  el.appendChild(newCol);el.appendChild(newLbl);newCol.style.opacity=0;newLbl.style.opacity=0;
  tw(newCol,{opacity:1},{dur:320});tw(newLbl,{opacity:1},{dur:320});tw(oldCol,{opacity:0},{dur:320});tw(oldLbl,{opacity:0},{dur:200});setTimeout(()=>{oldCol.remove();oldLbl.remove()},340);
  newCol.animate([{transform:'scale(.86)'},{transform:'scale(1.05)',offset:.55},{transform:'scale(1)'}],{duration:520,easing:EASE.std});
}
$('#save').addEventListener('click',()=>{
  if($('#save').disabled)return;musInit();
  const v=nameIn.value.trim().slice(0,32),nm=(!nameTouched&&v===autoName(sel))?'':v;
  const data={name:nm,act:sel.act||null,mood:sel.mood||null,words:sel.words||null,char:sel.char||null,genres:[...sel.genres]};
  let key;
  if(editKey){const w=waveOf(editKey);Object.assign(w,data);key=editKey}
  else{const w={id:Date.now().toString(36),...data};waves.push(w);key='own:'+w.id}
  persist();closeSheet(0);
  const isNew=!editKey;
  at(260,()=>{
    if(isNew){const keep=set[centerIdx()],k=makeSet();cancelAnimationFrame(anim);pos=Math.max(0,k.indexOf(keep));build(k);
      const i=k.indexOf(key),el=items[i];el.querySelector('.col').animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],{duration:560,easing:EASE.std});goTo(i,12)}
    else{refreshItem(key);goTo(set.indexOf(key),12)}
  });
  at(820,()=>{busy=false;activate(key)});
});
$('#del').addEventListener('click',()=>{
  if(!editKey)return;const key=editKey,wasActive=mode===key;
  waves=waves.filter(w=>'own:'+w.id!==key);persist();closeSheet(0);
  at(260,()=>{
    if(wasActive){busy=false;backToHabit();return}
    const i=set.indexOf(key),el=items[i];
    if(el)tw(el.querySelector('.col'),{opacity:0,transform:'scale(.6)'},{dur:260,ease:EASE.in}),tw(el.querySelector('.lbl'),{opacity:0},{dur:200});
    at(300,()=>{const k=makeSet();cancelAnimationFrame(anim);pos=Math.min(i,k.length-1);build(k)});
  });
});
/* свайп шторки вниз */
(()=>{let y0=null,last=[];sheet.addEventListener('pointerdown',e=>{if(!e.target.closest('.shead')||e.target.closest('input,button'))return;y0=e.clientY;stopSheet&&stopSheet();last=[[performance.now(),0]];sheet.setPointerCapture(e.pointerId)});
sheet.addEventListener('pointermove',e=>{if(y0===null)return;const dy=Math.max(0,(e.clientY-y0)/scale());setSheet(dy/sheetH());last.push([performance.now(),dy]);if(last.length>5)last.shift()});
sheet.addEventListener('pointerup',()=>{if(y0===null)return;y0=null;const a=last[0],b=last[last.length-1];const v=(b[1]-a[1])/Math.max(.016,(b[0]-a[0])/1000)/sheetH();
  if(sheetY>.28||v>1.2)closeSheet(v);else{stopSheet=spring(()=>sheetY,setSheet,0,{w:17,z:.92,v})}})})();

/* ================= старт ================= */
function idleCenter(keys){if(waves.length)return keys.indexOf('own:'+waves[waves.length-1].id);return keys.indexOf('create')}
function start(){mode=null;playing=false;cur=withAI(TRACKS.mp_one,null);queue=buildQueue(null,cur);qi=0;screen.dataset.state='paused';$('#track').innerHTML=pillHTML(cur);$('#aitxt').textContent=cur.ai;const k=makeSet();pos=idleCenter(k);build(k)}
$('#reset').addEventListener('click',()=>{clearTimeline();busy=false;waves=[];persist();closeSheet();music.fade();
  ['big','artist','cover','play','track','track2','info','heart','aitxt','chip','logo','httl','pill','pbase','pglass','pause','like','skel','row'].forEach(id=>{const el=$('#'+id);el.getAnimations().forEach(a=>a.cancel());el.removeAttribute('style')});
  bgTo({...PAL.idle},700);start()});
start();
(function warm(){const q=[...POOL,'create'];const step=()=>{const k=q.shift();if(!k)return;const P=colParts(k);rasterize(P.rk,P.inner).finally(()=>setTimeout(step,30))};rasterize(GHOST_RK,GHOST_INNER||nestBody(ghostSVG()));setTimeout(step,1500)})();
if(SHOT){const q=new URLSearchParams(location.search);if(q.get('pos'))pos=+q.get('pos'),layout()}
</script>
