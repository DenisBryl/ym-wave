:root{
  /* Цвет */
  --c-bg:#000000;
  --c-yellow:#FEFE00;
  --c-text:#FFFFFF;
  --c-text-2:#8E8D90;
  --c-text-3:#605F62;
  --c-pill:#131313;
  --c-pill-progress:#242424;
  --c-sheet:#19181B;
  --c-sheet-control:#28272A;
  --c-handle:#5E5B5F;
  --c-chip-dark:rgba(0,0,0,.3);
  --c-glass:rgba(255,255,255,.08);
  --c-glass-rim:rgba(255,255,255,.12);
  --c-glass-hi:rgba(255,255,255,.42);
  --c-overlay:rgba(0,0,0,.6);
  /* Шрифт: Yandex Music Sans / YS Text закрыты — ближайшие открытые замены */
  --f-display:'Inter Tight','Inter',system-ui,sans-serif;
  --f-text:'Inter',system-ui,sans-serif;
  /* Размеры, pt */
  --r-pill:999px;
  --r-sheet:20px;
  --play:96px;
  --row-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0E0E10;overflow:hidden}
body{font-family:var(--f-text);color:var(--c-text);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- мокап ---------- */
.stage{position:relative;width:393px;height:852px;transform-origin:center;flex:none}
.phone{position:absolute;inset:-12px;border-radius:67px;background:#1B1B1D;box-shadow:0 0 0 2px #2A2A2D,0 30px 80px rgba(0,0,0,.6)}
.screen{position:absolute;left:0;top:0;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--c-bg);isolation:isolate}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62.5px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 41px;font:600 17px/1 var(--f-text);letter-spacing:-.2px;pointer-events:none}
.status .r{display:flex;gap:7px;align-items:center}

/* ---------- фон ---------- */
#bg{position:absolute;left:0;top:0;width:393px;height:852px;z-index:0;pointer-events:none}
.bgfb{position:absolute;inset:0;z-index:0;pointer-events:none;display:none}
.nogl .bgfb{display:block}

/* ---------- шапка ---------- */
.hdr{position:absolute;left:0;right:0;top:54px;height:44px;z-index:20}
.hdr .ic{position:absolute;top:50%;transform:translate(-50%,-50%)}
.hdr .plus{left:27.6px;width:29.5px}
.hdr .search{left:364.5px;width:27.7px}
.hdr .logo{left:196.5px;width:189px}
.hdr .ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 20px/1 var(--f-display);letter-spacing:-.4px;color:var(--c-yellow);white-space:nowrap;opacity:0}
.chip{position:absolute;left:50%;top:50%;height:48px;margin-top:-24px;padding:0 13px 0 19.7px;border-radius:var(--r-pill);background:var(--c-chip-dark);display:flex;align-items:center;gap:9.8px;font:900 21px/1 var(--f-display);letter-spacing:-.3px;color:var(--c-yellow);white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.92);max-width:296px}
.chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-yellow);display:grid;place-items:center}

/* ---------- центр ---------- */
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero button{pointer-events:auto}
.big{position:absolute;left:0;right:0;top:213px;text-align:center;font:900 67px/0.92 var(--f-display);letter-spacing:-2px;white-space:nowrap}
.artist{position:absolute;left:14px;right:14px;top:var(--art-top,126px);height:164px;display:flex;align-items:center;justify-content:center;text-align:center;font:900 86px/.94 var(--f-display);letter-spacing:-2.6px;opacity:0;text-wrap:balance}
.cover{position:absolute;left:149px;top:311px;width:96px;height:96px;border-radius:6px;overflow:hidden;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cover svg{display:block}
.play{position:absolute;left:148.5px;top:308.4px;width:var(--play);height:var(--play);border-radius:50%;background:var(--c-yellow);display:grid;place-items:center}
.play:active{transform:scale(.96)}
.row{position:absolute;left:32px;top:417px;width:329px;height:var(--row-h)}
.pill{position:absolute;top:0;bottom:0;left:0;right:0;border-radius:var(--r-pill);overflow:hidden}
.pill .pbase{position:absolute;inset:0;background:var(--c-pill)}
.pill .prog{position:absolute;left:0;top:0;bottom:0;width:67.6%;background:var(--c-pill-progress)}
.glassy{background:var(--c-glass);-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);box-shadow:inset 0 .75px 0 var(--c-glass-hi),inset 0 0 0 1px var(--c-glass-rim)}
.pill .glass{position:absolute;inset:0;border-radius:inherit;opacity:0}
.pill .t{position:absolute;left:40px;right:61px;top:50%;transform:translateY(-50%);text-align:center;font:800 15px/18px var(--f-text);letter-spacing:-.3px;white-space:nowrap}
.pill .t2{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);text-align:center;font:800 16px/20px var(--f-text);letter-spacing:-.3px;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .skel{position:absolute;left:50%;top:50%;width:84px;height:12px;margin:-6px 0 0 -42px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.22),rgba(255,255,255,.10));background-size:200% 100%;opacity:0}
.pill .info{position:absolute;left:251.6px;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px}
.pill .heart{position:absolute;left:300.7px;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;display:grid;place-items:center}
.rb{position:absolute;top:0;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.8);pointer-events:none}
.rb.l{left:0}.rb.r{right:0}
.rb svg{opacity:0}
.ai{position:absolute;left:0;right:0;top:500px;height:60px}
.ai .spr{position:absolute;left:13.3px;top:10.6px;width:51.8px}
.ai .txt{position:absolute;left:66px;right:58px;top:1px;text-align:center;font:400 14.6px/17.7px var(--f-text);letter-spacing:-.25px;color:#F2F2F2}

/* ---------- барабан ---------- */
.drum{position:absolute;left:0;right:0;top:548px;height:210px;z-index:12;touch-action:pan-y;cursor:grab}
.burst{position:absolute;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,242,0,.9),rgba(255,210,0,.55) 45%,rgba(255,170,0,0));pointer-events:none;opacity:0;z-index:13;will-change:transform,opacity}
.drum.drag{cursor:grabbing}
.item{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;pointer-events:none}
.item .lay{position:absolute;left:0;top:0;width:0;height:0}
.item .bd{position:absolute;left:-95px;top:-93.1px;overflow:visible}
.item .ic{position:absolute;overflow:visible}
.item .gh{opacity:0}
.item .lbl{position:absolute;left:-64px;width:128px;top:-32.4px;text-align:center;font:500 14.2px/16.6px var(--f-text);letter-spacing:-.1px;color:#fff;text-wrap:balance;-webkit-hyphens:manual;hyphens:manual}
.item .lbl.two{top:-37.2px}
.item .cap{display:block;font:400 11.5px/14px var(--f-text);color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ttl2{display:block;margin-top:4.2px;font:600 15px/18px var(--f-text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.bare .lbl{color:var(--c-yellow)}
.item .bimg{position:absolute}

/* ---------- таббар ---------- */
.tabs{position:absolute;left:0;right:0;top:760px;height:92px;z-index:14;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 26px)}
.tabs img{position:absolute;top:30.5px;transform:translate(-50%,-50%)}

/* ---------- шторка ---------- */
.overlay{position:absolute;inset:0;z-index:70;background:#000;opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;max-height:792px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--c-sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(110%);padding:0 16px 30px;will-change:transform}
.sheet::-webkit-scrollbar{display:none}
.sheet .handle,.sheet .flashwrap,.sheet .s-ttl,.sheet .s-sub{touch-action:none}
.handle{width:35px;height:4.5px;border-radius:3px;background:var(--c-handle);margin:9px auto 0}
.flashwrap{position:relative;height:88px;margin-top:8px}
.flashwrap .glow{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(closest-side,var(--fg,rgba(57,91,140,.55)),rgba(0,0,0,0));filter:blur(10px);opacity:.9}
.flashwrap .fl{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
.flashwrap .fl>svg{position:absolute}
.s-ttl{text-align:center;font:900 26px/1 var(--f-display);letter-spacing:-.6px;margin-top:2px}
.s-sub{text-align:center;font:400 15px/20px var(--f-text);color:var(--c-text-2);margin-top:8px}
.grp{margin-top:14px}
.grp h4{font:400 15px/20px var(--f-text);color:var(--c-text-2);margin:0 0 7px 4px}
.grp h4 span{margin-left:8px;color:var(--c-text-3);font-size:13px}
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;touch-action:pan-x;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.c{flex:none;height:38px;padding:0 16px;border-radius:var(--r-pill);background:var(--c-sheet-control);font:500 15px/38px var(--f-text);letter-spacing:-.15px;color:#fff;transition:background-color .18s cubic-bezier(.3,0,.2,1),color .18s cubic-bezier(.3,0,.2,1),transform .22s cubic-bezier(.3,0,.2,1)}
.c:active{transform:scale(.95);transition-duration:.08s}
.c.on{background:var(--c-yellow);color:#000}
.save{display:block;width:100%;height:56px;margin-top:22px;border-radius:var(--r-pill);background:var(--c-yellow);color:#000;font:700 17px/56px var(--f-text);letter-spacing:-.3px;transition:background-color .2s cubic-bezier(.3,0,.2,1),color .2s cubic-bezier(.3,0,.2,1),transform .22s cubic-bezier(.3,0,.2,1)}
.save:disabled{background:var(--c-sheet-control);color:var(--c-text-3);cursor:default}
.save:not(:disabled):active{transform:scale(.97);transition-duration:.08s}
.nm{display:block;width:100%;height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--c-sheet-control);color:#fff;font:600 17px/48px var(--f-text);letter-spacing:-.3px;caret-color:var(--c-yellow);outline:none;-webkit-user-select:text;user-select:text;transition:box-shadow .18s cubic-bezier(.3,0,.2,1)}
.nm::placeholder{color:var(--c-text-2);font-weight:500}
.nm:focus{box-shadow:inset 0 0 0 1.5px rgba(254,254,0,.55)}
.del{display:block;width:100%;height:44px;margin-top:6px;font:500 15px/44px var(--f-text);color:#FF6A5C}
.del:active{opacity:.6}

/* ---------- вне мокапа ---------- */
.reset{position:fixed;right:16px;bottom:16px;font:500 13px/1 var(--f-text);color:#6b6b70;padding:8px 12px;border-radius:999px;background:#1A1A1D}
.reset:hover{color:#aaa}
body.shot{display:block;background:#000}.shot .phone,.shot .island,.shot .reset{display:none}.shot .stage{transform:none!important}.shot .screen{border-radius:0}
</style>
</head>

/* контур капли, pt; (0,0) — вершина, x от центра подписи. Снят по кадрам барабана */
const BODY_PTS=[[-58,140],[-62.5,118],[-65.5,98],[-66,82],[-64.5,66],[-61,52],[-55.5,39],[-48,27.5],[-39.5,18],[-30,10.8],[-20,5.6],[-10,2.4],[0,.6],[9,0],[15,-.1],[20,0],[25,.9],[30.4,1.8],[35.7,3.1],[41,5.3],[46.5,8.5],[51.8,12],[57,17],[62.5,24],[67,32],[70.3,41],[72.4,50],[73.4,60],[73.3,70],[72.2,82],[70,96],[66.5,112],[62,128],[57,146],[46,205],[-46,205]];
const BODY=(()=>{const P=BODY_PTS.map(p=>[p[0],+(p[1]*.99).toFixed(2)]),n=P.length;let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0]} ${p2[1]}`}
  return d+'Z'})();
const VB='-95 -18 190 300',VBR='x="-95" y="-18" width="190" height="300"';
function bodySVG(c){
  const id='b'+(UID++),c1=hex(c.c1),dk=rgb(c1.map(v=>v*.35));
  return `<svg class="bd" width="190" height="300" viewBox="${VB}"><defs>
<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="55.5" y1="21.2" x2="-32" y2="161.1"><stop offset="0" stop-color="${c.c1}"/><stop offset=".47" stop-color="${dk}"/><stop offset=".58" stop-color="${dk}" stop-opacity=".57"/><stop offset=".76" stop-color="${dk}" stop-opacity=".23"/><stop offset="1" stop-color="${dk}" stop-opacity="0"/></linearGradient>
<radialGradient id="${id}sg" gradientUnits="userSpaceOnUse" cx="50" cy="14" r="64"><stop offset=".42" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="${id}bg" gradientUnits="userSpaceOnUse" cx="50" cy="14" r="64"><stop offset=".34" stop-color="#000"/><stop offset=".78" stop-color="#fff"/></radialGradient>
<linearGradient id="${id}hg" gradientUnits="userSpaceOnUse" x1="-34" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="${id}vg" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="80"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="${id}S" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}sg)"/></mask>
<mask id="${id}B" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}bg)"/></mask>
<mask id="${id}H" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}hg)"/></mask>
<mask id="${id}V" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}vg)"/></mask>
<filter id="${id}f" filterUnits="userSpaceOnUse" ${VBR}><feGaussianBlur stdDeviation="7.5"/></filter>
<filter id="${id}f2" filterUnits="userSpaceOnUse" ${VBR}><feGaussianBlur stdDeviation="3.2"/></filter>
<clipPath id="${id}c"><path d="${BODY}"/></clipPath></defs>
<g mask="url(#${id}B)"><path d="${BODY}" fill="url(#${id}g)" filter="url(#${id}f)"/></g>
<g mask="url(#${id}S)"><path d="${BODY}" fill="url(#${id}g)"/></g>
<g mask="url(#${id}V)"><g mask="url(#${id}H)" clip-path="url(#${id}c)"><path d="${BODY}" fill="none" stroke="${c.rim}" stroke-width="11" stroke-opacity=".22" filter="url(#${id}f2)"/><path d="${BODY}" fill="none" stroke="${c.rim}" stroke-width="2.5"/></g></g>
</svg>`;
}
function ghostSVG(){
  const id='g'+(UID++);
  return `<svg class="bd" width="190" height="300" viewBox="${VB}"><defs>
<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="-10" y2="150"><stop offset="0" stop-color="#fff" stop-opacity=".075"/><stop offset=".55" stop-color="#fff" stop-opacity=".035"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="${id}hg" gradientUnits="userSpaceOnUse" x1="-44" y1="0" x2="-6" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="${id}vg" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="150"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="${id}H" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}hg)"/></mask>
<mask id="${id}V" maskUnits="userSpaceOnUse" ${VBR}><rect ${VBR} fill="url(#${id}vg)"/></mask>
<clipPath id="${id}c"><path d="${BODY}"/></clipPath></defs>
<path d="${BODY}" fill="url(#${id}g)"/>
<g mask="url(#${id}V)"><g mask="url(#${id}H)" clip-path="url(#${id}c)"><path d="${BODY}" fill="none" stroke="#D9D9D9" stroke-width="2.4"/></g></g>
</svg>`;
}
/* иконка: прогрессивное размытие (верх-лево мыло → низ-право резко) + светлый внутренний кант */
function iconSVG(k,fill,rimc,size){
  const v=ICONS[k],id='i'+(UID++),pad=9,W=v.w+pad*2,H=v.h+pad*2,s=(size||1)*(v.sc||1);
  const R=`x="${-pad}" y="${-pad}" width="${W}" height="${H}"`;
  return `<svg class="isvg" width="${(W*s).toFixed(2)}" height="${(H*s).toFixed(2)}" viewBox="${-pad} ${-pad} ${W} ${H}" style="left:${(-W*s/2).toFixed(2)}px;top:${(-H*s/2).toFixed(2)}px;position:absolute;overflow:visible"><defs>
<linearGradient id="${id}sg" gradientUnits="userSpaceOnUse" x1="${v.w*.1}" y1="${v.h*.1}" x2="${v.w*.6}" y2="${v.h*.6}"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="${id}bg" gradientUnits="userSpaceOnUse" x1="${v.w*.38}" y1="${v.h*.38}" x2="${v.w*.8}" y2="${v.h*.8}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="${id}rg" gradientUnits="userSpaceOnUse" x1="${v.w*.32}" y1="${v.h*.32}" x2="${v.w*.78}" y2="${v.h*.78}"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="${id}S" maskUnits="userSpaceOnUse" ${R}><rect ${R} fill="url(#${id}sg)"/></mask>
<mask id="${id}B" maskUnits="userSpaceOnUse" ${R}><rect ${R} fill="url(#${id}bg)"/></mask>
<mask id="${id}R" maskUnits="userSpaceOnUse" ${R}><rect ${R} fill="url(#${id}rg)"/></mask>
<filter id="${id}f" filterUnits="userSpaceOnUse" ${R}><feGaussianBlur stdDeviation="2.9"/></filter>
<filter id="${id}f1" filterUnits="userSpaceOnUse" ${R}><feGaussianBlur stdDeviation="1.1"/></filter>
<clipPath id="${id}c"><path d="${v.d}" fill-rule="evenodd"/></clipPath></defs>
<g mask="url(#${id}B)"><path d="${v.d}" fill-rule="evenodd" fill="${fill}" filter="url(#${id}f)"/></g>
<g mask="url(#${id}S)"><path d="${v.d}" fill-rule="evenodd" fill="${fill}"/></g>
<g mask="url(#${id}R)" clip-path="url(#${id}c)"><path d="${v.d}" fill="none" stroke="${rimc}" stroke-width="4" stroke-opacity=".35" filter="url(#${id}f1)"/><path d="${v.d}" fill="none" stroke="${rimc}" stroke-width="1.9"/></g>
</svg>`;
}

  for(let i=0;i<items.length;i++){

/* доводка: критически задемпфированная пружина, стартует с текущей скорости — без рывка и без отскока */
function settle(target,v=0,w=11,cb){
  cancelAnimationFrame(anim);
  const e0=target-pos;if(Math.sign(v)===Math.sign(e0)&&Math.abs(v)>w*Math.abs(e0))v=w*e0;
  let vel=v,last=performance.now();
  const step=t=>{let dt=Math.min(.1,(t-last)/1000);last=t;
    while(dt>1e-6){const h=Math.min(dt,1/240);const f=-w*w*(pos-target)-2*w*vel;vel+=f*h;pos+=vel*h;dt-=h}layout();

let drag=null,lp=null;

function hitItem(clientX){const r=drum.getBoundingClientRect(),lx=(clientX-r.left)/scale(),dt=(lx-CX)/SP;let best=-1,bd=.55;
  for(let i=0;i<items.length;i++){const e=Math.abs(wrapD(i)-dt);if(e<bd){bd=e;best=i}}return best}
drum.addEventListener('pointerdown',e=>{
  if(busy)return;cancelAnimationFrame(anim);

  if(!drag)return;const dx=(e.clientX-drag.x)/scale();drag.moved=Math.max(drag.moved,Math.abs(dx));

function Song(id){

    if(S.snare&&S.snare[s]==='x')I.snare(g,t,S.clap&&s%8===4);

const BUF=new Map(),LOADING=new Map();
function fetchBuf(T){
  if(BUF.has(T.id))return Promise.resolve(BUF.get(T.id));
  if(LOADING.has(T.id))return LOADING.get(T.id);
  if(!MUS.ctx||location.protocol==='file:')return Promise.reject('nofetch');
  const pr=fetch('audio/'+T.id+'.mp3').then(r=>{if(!r.ok)throw r.status;return r.arrayBuffer()})
    .then(ab=>new Promise((res,rej)=>MUS.ctx.decodeAudioData(ab,res,rej)))
    .then(buf=>{BUF.set(T.id,buf);LOADING.delete(T.id);if(BUF.size>8)BUF.delete(BUF.keys().next().value);return buf})
    .catch(e=>{LOADING.delete(T.id);throw e});
  LOADING.set(T.id,pr);return pr;
}

/* один «голос»: буфер, <audio> или генеративная подложка — с одинаковым интерфейсом */
function Voice(T){

    const src=c.createBufferSource();src.buffer=buf;src.loop=true;const g=c.createGain();g.gain.value=.0001;src.connect(g);g.connect(MUS.real);
    src.start(0,off%buf.duration);v.t0=c.currentTime-off;v.src=src;v.g=g;ramp(g,1,off?.35:.7);
  }
  v.start=()=>{
    fetchBuf(T).then(buf=>{if(v.dead)return;v.kind='buf';v.buf=buf;if(!v.paused)startBuf(buf,0);else v.off=0})
    .catch(()=>{if(v.dead)return;
      const el=new Audio('audio/'+T.id+'.mp3');el.loop=true;el.preload='auto';el.volume=0;v.el=el;
      el.play().then(()=>{if(v.dead||v.paused){el.pause();return}v.kind='el';elFade(1,.7)}).catch(()=>{if(v.dead)return;v.el=null;v.kind='gen';v.song=Song(T.id);if(!v.paused)v.song.start()});

  showPlaying(cur,{delay:60});setAI(cur);
}
/* общая загрузка новой волны: пятно в цвете пузыря → контент уходит → барабан стекленеет → скелетон → поле трека → контент → барабан наполняется */
function load(newMode,T,{col=null,center='back'}={}){
  if(busy)return;busy=true;clearTimeline();musInit();
  const was=playing;mode=newMode;cur=T;playing=true;screen.dataset.state='playing';
  if(col)bgTo({...LOADPAL[col],Base:'#000000',F:0,spd:2.2},was?520:260,'out');
  else{BG.cur.spd=2.2}
  music.fade();
  at(160,()=>{
    tw($('#big'),{opacity:0,transform:'scale(.97)'},{dur:200,ease:EASE.in});
    tw($('#artist'),{opacity:0,transform:'scale(.97)'},{dur:200,ease:EASE.in});
    tw($('#cover'),{opacity:0,transform:'scale(.94)'},{dur:200,ease:EASE.in});
    tw($('#play'),{opacity:0,transform:'scale(.86)'},{dur:200,ease:EASE.in});$('#play').style.pointerEvents='none';
    tw($('#track'),{opacity:0},{dur:160});tw($('#track2'),{opacity:0},{dur:160});tw($('#info'),{opacity:0},{dur:160});tw($('#heart'),{opacity:0},{dur:160});
    tw($('#aitxt'),{opacity:0},{dur:180});
    tw($('#chip'),{opacity:0,transform:'translateX(-50%) scale(.92)'},{dur:180});$('#chip').style.pointerEvents='none';
    tw($('#httl'),{opacity:0},{dur:180});tw($('#logo'),{opacity:0},{dur:180});
  });
  at(220,()=>drumGhost(true));
  at(360,()=>{
    tw($('#pill'),{left:'61px',right:'61px'},{dur:420,ease:EASE.emph});tw($('#row'),{top:'421px'},{dur:420,ease:EASE.emph});
    tw($('#pbase'),{opacity:0},{dur:240});tw($('#pglass'),{opacity:1},{dur:320});
    [$('#pause'),$('#like')].forEach(b=>{tw(b,{opacity:1,transform:'scale(1)'},{dur:360,ease:EASE.emph});b.style.pointerEvents='auto'});
    [$('#pause svg'),$('#like svg')].forEach(s=>tw(s,{opacity:0},{dur:120}));
    const sk=$('#skel');tw(sk,{opacity:1},{dur:220,delay:120});sk.animate([{backgroundPosition:'200% 0'},{backgroundPosition:'-200% 0'}],{duration:1100,iterations:Infinity});
  });
  at(1150,()=>{const sk=$('#skel');sk.getAnimations().forEach(a=>a.cancel());sk.style.opacity=0;$('#track2').textContent=T.title;tw($('#track2'),{opacity:1},{dur:220,delay:40})});
  at(1230,()=>{bgTo(fieldPal(T),560,'inOut');music.play(T)});
  at(1320,()=>{
    header(hasChip()?'chip':'title',hasChip()?info(mode).label:'');
    setArtist(T);$('#artist').style.transform='translateY(8px)';tw($('#artist'),{opacity:1,transform:'translateY(0)'},{dur:360,ease:EASE.emph});
    $('#cover').innerHTML=coverSVG(T);$('#cover').style.transform='scale(.9)';tw($('#cover'),{opacity:1,transform:'scale(1)'},{dur:380,ease:EASE.emph,delay:60});
    setPausedIcon(false);[$('#pause svg'),$('#like svg')].forEach(s=>tw(s,{opacity:1},{dur:220,delay:80}));
  });
  at(1580,()=>{$('#aitxt').textContent=T.ai;tw($('#aitxt'),{opacity:1},{dur:300})});
  at(1880,()=>{const k=makeSet();refill(k,Math.max(0,k.indexOf(center)))});
  at(2350,()=>{busy=false});
}
function activate(key){const {col,T}=info(key);prefetch(T);load(key,withAI(T,key),{col})}
function pickDefault(){const pool=DEFAULT_POOL.filter(id=>id!==cur.id);return TRACKS[pool[Math.floor(Math.random()*pool.length)]]}
/* «Назад к привычному» — как в приложении: обычная «Моя волна» с новым треком */
function backToHabit(){const T=withAI(pickDefault(),null);prefetch(T);load(null,T,{center:'shake'})}
/* «Встряхнуть Мою волну»: жёлтая вспышка поднимается от кнопки, затем новый трек */
function shakeWave(el){
  if(busy)return;busy=true;clearTimeline();musInit();
  const T=withAI(pickDefault(),null),was=playing;prefetch(T);mode='shake';cur=T;playing=true;screen.dataset.state='playing';
  const b=$('#burst'),d=el?wrapD(+el.dataset.i):0;
  b.style.left=(CX+d*SP)+'px';b.style.top='648px';
  /* вспышка поднимается от кнопки и заливает экран жёлтым, как в приложении */
  b.animate([{transform:'translateY(0) scale(.1)',opacity:0},{transform:'translateY(-30px) scale(.6)',opacity:1,offset:.2},{transform:'translateY(-260px) scale(1.9)',opacity:.85,offset:.55},{transform:'translateY(-380px) scale(2.6)',opacity:0}],{duration:1500,easing:'cubic-bezier(.3,.1,.3,1)'});
  const F=BG.cur.F;
  at(120,()=>bgTo({A:'#FF8A00',B:'#FFF200',C:'#FFB800',D:'#FFF9B0',Base:F>.5?'#3A2A00':'#000000',F,spd:2.4},520,'out'));
  music.fade();
  at(950,()=>{
    bgTo(fieldPal(T),560,'inOut');music.play(T);
    if(was){tw($('#artist'),{opacity:0},{dur:180,ease:EASE.in});tw($('#cover'),{opacity:0,transform:'scale(.94)'},{dur:180,ease:EASE.in});tw($('#track2'),{opacity:0},{dur:140})}
    header('title');drumGhost(true);
    showPlaying(T,{delay:was?190:60,slide:false});setAI(T,120);
  });
  at(1300,()=>{const k=makeSet();refill(k,Math.max(0,k.indexOf('back')))});
  at(1750,()=>{busy=false});
}
/* барабан: стекло ↔ цвет */
function drumGhost(on){
  items.forEach(el=>{
    const cols=el.querySelectorAll('.col'),gh=el.querySelector('.gh'),lbs=el.querySelectorAll('.lbl');
    if(on){cols.forEach(c=>tw(c,{opacity:0},{dur:170,ease:EASE.std}));gh&&tw(gh,{opacity:1},{dur:200});lbs.forEach(l=>tw(l,{opacity:0},{dur:150}))}
    else{cols.forEach(c=>tw(c,{opacity:1},{dur:300}));gh&&tw(gh,{opacity:0},{dur:300});lbs.forEach(l=>tw(l,{opacity:1},{dur:300}))}
  });
}
/* наполнение: новый набор появляется из стекла */
function refill(keys,center){
  cancelAnimationFrame(anim);pos=center;build(keys);
  items.forEach((el,i)=>{
    const ad=Math.abs(wrapD(i));if(ad>2.4)return;
    const col=el.querySelector('.col'),gh=el.querySelector('.gh'),lb=el.querySelector('.lbl');
    col.style.opacity=0;lb&&(lb.style.opacity=0);gh&&(gh.style.opacity=1);
    const dl=ad*45;
    tw(col,{opacity:1},{dur:340,delay:dl});lb&&tw(lb,{opacity:1},{dur:340,delay:dl});gh&&tw(gh,{opacity:0},{dur:340,delay:dl});
  });
}
/* шапка: ⊗ — «Назад к привычному»; название своей волны — её настройки */
$('#chip').addEventListener('click',e=>{if(!e.target.closest('i')&&isOwn(mode))openSheet(mode);else backToHabit()});
$('#play').addEventListener('click',()=>{musInit();resume()});
$('#pause').addEventListener('click',()=>{if(playing)pauseNow()});
$('#like').addEventListener('click',e=>{const p=$('#like path');const on=p.getAttribute('fill')!=='#fff';p.setAttribute('fill',on?'#fff':'none');$('#like svg').animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:320,easing:EASE.std})});

/* ================= шторка: создание и настройки своей волны ================= */
let sel={},editKey=null,sheetY=1,stopSheet=null,nameTouched=false;
const sheet=$('#sheet'),overlay=$('#overlay'),nameIn=$('#wname');
function sheetH(){return sheet.offsetHeight||600}
function setSheet(y){sheetY=y;sheet.style.transform=`translateY(${(y*sheetH()).toFixed(1)}px)`;overlay.style.opacity=(.6*(1-clamp(y,0,1))).toFixed(3)}
setSheet(1.1);
function openSheet(key){
  if(busy)return;
  editKey=key&&isOwn(key)?key:null;const w=editKey&&waveOf(editKey);
  sel=w?{act:w.act,mood:w.mood,words:w.words,char:w.char,genres:[...(w.genres||[])]}:{genres:[]};Object.keys(sel).forEach(k=>sel[k]||delete sel[k]);if(!sel.genres)sel.genres=[];sheet.scrollTop=0;
  nameTouched=!!(w&&w.name);nameIn.value=nameTouched?w.name:'';
  $('#sTtl').textContent=w?'Настройки волны':'Своя волна';
  $('#sSub').style.display=w?'none':'';$('#del').style.display=w?'':'none';
  curFlCol=null;paintSheet(true);
  overlay.style.pointerEvents='auto';stopSheet&&stopSheet();
  stopSheet=spring(()=>sheetY,setSheet,0,{w:17,z:.92});
}
function closeSheet(v=0,cb){
  nameIn.blur();overlay.style.pointerEvents='none';stopSheet&&stopSheet();
  stopSheet=spring(()=>sheetY,setSheet,1.1,{w:19,z:1,v,done:cb});
}
overlay.addEventListener('click',()=>closeSheet());
/* превью: та же иконка, что в барабане, крупно; цвет и поворот — пружиной */
let flRot=0,flSc=1,stopFl=null,curFlCol=null;
function paintSheet(first){
  document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.c').forEach(c=>c.classList.toggle('on',g.dataset.multi?sel.genres.includes(c.dataset.v):sel[g.dataset.g]===c.dataset.v)));
  const any=['act','mood','words','char'].some(k=>sel[k])||sel.genres.length>0;$('#save').disabled=!any;
  /* название подставляется само из выбора, пока его не правили руками; без выбора — пусто */
  if(!nameTouched)nameIn.value=any?autoName(sel):'';
  nameIn.placeholder='Название волны';
  const colKey=any?MOOD_COL[moodOf(sel)]:'slate',C=NAT[colKey];
  if(colKey!==curFlCol){
    curFlCol=colKey;const fl=$('#fl'),old=[...fl.children];
    const w=document.createElement('div');w.style.cssText='position:absolute;left:0;top:0';w.innerHTML=iconSVG('flash',C.ic,C.icr,1.32);fl.appendChild(w);
    if(!first){w.style.opacity=0;tw(w,{opacity:1},{dur:260});old.forEach(o=>{tw(o,{opacity:0},{dur:260});setTimeout(()=>o.remove(),280)})}else old.forEach(o=>o.remove());
    $('#glow').style.setProperty('--fg',C.c1+'8C');
  }
  const n=['act','mood','words','char'].filter(k=>sel[k]).length+sel.genres.length,tr=n*20,ts=1+Math.min(n,6)*.04;
  if(first){flRot=tr;flSc=ts;$('#fl').style.transform=`rotate(${flRot}deg) scale(${flSc})`}
  else{stopFl&&stopFl();const r0=flRot,s0=flSc;let k=0;stopFl=spring(()=>k,x=>{k=x;flRot=lerp(r0,tr,x);flSc=lerp(s0,ts,x);$('#fl').style.transform=`rotate(${flRot.toFixed(2)}deg) scale(${flSc.toFixed(4)})`},1,{w:13,z:.62})}
  $('#save').textContent=editKey?'Сохранить':'Добавить в барабан';
}
document.querySelectorAll('.chips').forEach(g=>g.addEventListener('click',e=>{const c=e.target.closest('.c');if(!c)return;const k=g.dataset.g,v=c.dataset.v;
  if(g.dataset.multi){const a=sel.genres,i=a.indexOf(v);if(i>=0)a.splice(i,1);else{a.push(v);if(a.length>+g.dataset.multi)a.shift()}}
  else{sel[k]=sel[k]===v?undefined:v;if(!sel[k])delete sel[k]}
  paintSheet()}));
nameIn.addEventListener('input',()=>{nameTouched=nameIn.value.trim()!==''});
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')nameIn.blur()});
/* пузырь перекрашивается на месте */
function refreshItem(key){
  const i=set.indexOf(key),el=items[i];if(!el)return;
  const fresh=document.createElement('div');fresh.innerHTML=colHTML(key)+lblHTML(key);
  const newCol=fresh.querySelector('.col'),newLbl=fresh.querySelector('.lbl'),oldCol=el.querySelector('.col'),oldLbl=el.querySelector('.lbl');
  el.appendChild(newCol);el.appendChild(newLbl);newCol.style.opacity=0;newLbl.style.opacity=0;
  tw(newCol,{opacity:1},{dur:320});tw(newLbl,{opacity:1},{dur:320});tw(oldCol,{opacity:0},{dur:320});tw(oldLbl,{opacity:0},{dur:200});setTimeout(()=>{oldCol.remove();oldLbl.remove()},340);
  newCol.querySelector('.ic').animate([{transform:'scale(.7)'},{transform:'scale(1.12)',offset:.55},{transform:'scale(1)'}],{duration:520,easing:EASE.std});
}
$('#save').addEventListener('click',()=>{
  if($('#save').disabled)return;musInit();
  const v=nameIn.value.trim().slice(0,32),nm=(!nameTouched&&v===autoName(sel))?'':v;
  const data={name:nm,act:sel.act||null,mood:sel.mood||null,words:sel.words||null,char:sel.char||null,genres:[...sel.genres]};
  let key;
  if(editKey){const w=waveOf(editKey);Object.assign(w,data);key=editKey}
  else{const w={id:Date.now().toString(36),...data};waves.push(w);key='own:'+w.id}
  persist();closeSheet(0);
  const isNew=!editKey;
  at(260,()=>{
    if(isNew){const keep=set[centerIdx()],k=makeSet();cancelAnimationFrame(anim);pos=Math.max(0,k.indexOf(keep));build(k);
      const i=k.indexOf(key),el=items[i];el.querySelector('.col').animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],{duration:560,easing:EASE.std});goTo(i,12)}
    else{refreshItem(key);goTo(set.indexOf(key),12)}
  });
  at(820,()=>{busy=false;activate(key)});
});
$('#del').addEventListener('click',()=>{
  if(!editKey)return;const key=editKey,wasActive=mode===key;
  waves=waves.filter(w=>'own:'+w.id!==key);persist();closeSheet(0);
  at(260,()=>{
    if(wasActive){busy=false;backToHabit();return}
    const i=set.indexOf(key),el=items[i];
    if(el)tw(el.querySelector('.col'),{opacity:0,transform:'scale(.6)'},{dur:260,ease:EASE.in}),tw(el.querySelector('.lbl'),{opacity:0},{dur:200});
    at(300,()=>{const k=makeSet();cancelAnimationFrame(anim);pos=Math.min(i,k.length-1);build(k)});
  });
});
/* свайп шторки вниз */
(()=>{let y0=null,last=[];sheet.addEventListener('pointerdown',e=>{if(!e.target.closest('.handle,.flashwrap,.s-ttl,.s-sub'))return;y0=e.clientY;stopSheet&&stopSheet();last=[[performance.now(),0]];sheet.setPointerCapture(e.pointerId)});
sheet.addEventListener('pointermove',e=>{if(y0===null)return;const dy=Math.max(0,(e.clientY-y0)/scale());setSheet(dy/sheetH());last.push([performance.now(),dy]);if(last.length>5)last.shift()});
sheet.addEventListener('pointerup',()=>{if(y0===null)return;y0=null;const a=last[0],b=last[last.length-1];const v=(b[1]-a[1])/Math.max(.016,(b[0]-a[0])/1000)/sheetH();
  if(sheetY>.28||v>1.2)closeSheet(v);else{stopSheet=spring(()=>sheetY,setSheet,0,{w:17,z:.92,v})}})})();

/* ================= старт ================= */
function idleCenter(keys){if(waves.length)return keys.indexOf('own:'+waves[waves.length-1].id);return keys.indexOf('create')}
function start(){mode=null;playing=false;cur=withAI(TRACKS.mp_one,null);screen.dataset.state='paused';$('#track').innerHTML=pillHTML(cur);$('#aitxt').textContent=cur.ai;const k=makeSet();pos=idleCenter(k);build(k)}
$('#reset').addEventListener('click',()=>{clearTimeline();busy=false;waves=[];persist();closeSheet();music.fade();
  ['big','artist','cover','play','track','track2','info','heart','aitxt','chip','logo','httl','pill','pbase','pglass','pause','like','skel','row'].forEach(id=>{const el=$('#'+id);el.getAnimations().forEach(a=>a.cancel());el.removeAttribute('style')});
  bgTo({...PAL.idle},700);start()});
start();
if(SHOT){const q=new URLSearchParams(location.search);if(q.get('pos'))pos=+q.get('pos'),layout()}
</script>
</body>
</html>
